<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工具入库记录</title>
<link rel="stylesheet" href="css/style.css">
<style>
.form-row { display: flex; gap: 12px; flex-wrap: wrap; }
.form-item { display: flex; flex-direction: column; gap: 4px; min-width: 150px; flex: 1; }
.form-item label { font-size: 13px; color: var(--muted); }
.form-item input, .form-item select { padding: 9px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; }
#editMask { position: fixed; inset: 0; background: rgba(20,30,45,.45); display: none; align-items: center; justify-content: center; z-index: 50; }
#editMask .modal { background: #fff; border-radius: 14px; padding: 22px 24px; width: min(760px, 94vw); max-height: 90vh; overflow: auto; box-shadow: 0 16px 50px rgba(0,0,0,.25); }
#editMask h3 { margin: 0 0 14px; color: var(--primary); }
</style>
</head>
<body>
<div class="container">

  <!-- 录入区 -->
  <div class="card need-write no-print">
    <h2>新增工具入库记录 —— 仓库管理员 / 工具管理员填写</h2>
    <div class="form-row">
      <div class="form-item"><label><b>*</b> 入库日期</label><input type="date" id="f_date"></div>
      <div class="form-item"><label>工具编号</label><input id="f_code" placeholder="如 DZ-001（关联档案，可选）"></div>
      <div class="form-item"><label>工具名称</label><input id="f_name" placeholder="如 手套（可选）"></div>
    </div>
    <div class="form-row" style="margin-top:10px">
      <div class="form-item"><label>供应商</label><input id="f_supplier" placeholder="供应商名称"></div>
      <div class="form-item"><label>批次号</label><input id="f_batch" placeholder="入库批次号"></div>
      <div class="form-item"><label><b>*</b> 入库数量</label><input type="number" id="f_qty" min="1" value="1"></div>
      <div class="form-item"><label>单价(元/个)</label><input type="number" id="f_price" step="0.01" min="0" placeholder="可选"></div>
      <div class="form-item" style="flex:2"><label>备注</label><input id="f_remark" placeholder="备注说明"></div>
    </div>
    <div style="margin-top:14px">
      <button class="btn green" onclick="save()">✔ 保存入库记录</button>
      <button class="btn ghost" onclick="resetForm()">清空</button>
    </div>
    <p style="color:var(--muted);font-size:12.5px;margin-top:10px">
      说明：保存后系统会自动按<b>工具编号（编号为空时按名称）</b>把数量累加到「工具档案」的库存；同一工具的不同批次都会在此按入库日期留痕，方便按批次追溯。
    </p>
  </div>

  <!-- 查询 + 列表 -->
  <div class="card">
    <div class="toolbar no-print">
      <div class="form-item"><label>工具</label><input id="q_tool" placeholder="编号或名称"></div>
      <div class="form-item"><label>批次号</label><input id="q_batch" placeholder="批次号"></div>
      <div class="form-item"><label>供应商</label><input id="q_supplier" placeholder="供应商"></div>
      <div class="form-item"><label>日期从</label><input type="date" id="q_from"></div>
      <div class="form-item"><label>到</label><input type="date" id="q_to"></div>
      <button class="btn" onclick="load()">🔍 查询</button>
      <span class="spacer"></span>
      <button class="btn ghost" onclick="doExport()">📤 导出Excel</button>
      <button class="btn ghost" onclick="App.print('工具入库记录','')">🖨️ 打印</button>
    </div>
    <div class="print-header"></div>
    <div class="table-wrap">
      <table class="data">
        <thead><tr>
          <th>序号</th><th>入库日期</th><th>工具编号</th><th>工具名称</th><th>入库数量</th>
          <th>供应商</th><th>批次号</th><th>单价(元/个)</th><th>备注</th><th>录入人</th>
          <th class="actions-col need-write">操作</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="print-sign">
      <span>仓库管理员：＿＿＿＿＿＿</span><span>复核：＿＿＿＿＿＿</span><span>主管：＿＿＿＿＿＿</span>
    </div>
  </div>
</div>

<!-- 编辑弹窗 -->
<div id="editMask">
  <div class="modal">
    <h3>编辑工具入库记录</h3>
    <input type="hidden" id="e_id">
    <div class="form-row">
      <div class="form-item"><label>入库日期</label><input type="date" id="e_date"></div>
      <div class="form-item"><label>工具编号</label><input id="e_code"></div>
      <div class="form-item"><label>工具名称</label><input id="e_name"></div>
    </div>
    <div class="form-row" style="margin-top:10px">
      <div class="form-item"><label>供应商</label><input id="e_supplier"></div>
      <div class="form-item"><label>批次号</label><input id="e_batch"></div>
      <div class="form-item"><label>入库数量</label><input type="number" id="e_qty" min="1"></div>
      <div class="form-item"><label>单价(元/个)</label><input type="number" id="e_price" step="0.01" min="0"></div>
      <div class="form-item" style="flex:2"><label>备注</label><input id="e_remark"></div>
    </div>
    <div style="margin-top:16px; display:flex; gap:10px; justify-content:flex-end">
      <button class="btn green" onclick="saveEdit()">✔ 保存</button>
      <button class="btn ghost" onclick="closeEdit()">取消</button>
    </div>
  </div>
</div>

<script src="js/vendor/xlsx.full.min.js"></script>
<script src="js/app.js"></script>
<script src="js/pair-ac.js"></script>
<script>
App.nav('tool_inbound.html');
let rows = [];

$('#f_date').value = App.today();

// 加载工具档案，供「编号 ↔ 名称」双向模糊联动选择
let toolItems = [];
async function loadTools() {
  try {
    const arr = await App.get('/api/tools?limit=2000');
    const list = (arr || [])
      .map(t => ({ code: t.code || '', name: t.name || '' }))
      .filter(t => t.code || t.name);
    toolItems.length = 0; toolItems.push(...list);   // 原地修改，保持 PairAC 引用有效
    if (!$('#f_code')._pairAC) PairAC.init($('#f_code'), $('#f_name'), toolItems);
    else PairAC.setItems($('#f_code'), $('#f_name'), toolItems);
    if (!$('#e_code')._pairAC) PairAC.init($('#e_code'), $('#e_name'), toolItems);
    else PairAC.setItems($('#e_code'), $('#e_name'), toolItems);
  } catch (e) { console.warn('工具列表加载失败', e); }
}
loadTools();

function collect() {
  const date = $('#f_date').value;
  const code = $('#f_code').value.trim();
  const name = $('#f_name').value.trim();
  const qty = Math.max(1, parseInt($('#f_qty').value) || 1);
  if (!date) return App.toast('请填写入库日期', 'err');
  if (!code && !name) return App.toast('请填写工具编号或名称', 'err');
  return {
    inbound_date: date, tool_code: code, tool_name: name,
    supplier: $('#f_supplier').value.trim(),
    batch_no: $('#f_batch').value.trim(),
    qty,
    price: parseFloat($('#f_price').value) || 0,
    remark: $('#f_remark').value.trim()
  };
}
function resetForm() {
  $('#f_code').value = ''; $('#f_name').value = ''; $('#f_supplier').value = '';
  $('#f_batch').value = ''; $('#f_qty').value = '1'; $('#f_price').value = '';
  $('#f_remark').value = ''; $('#f_date').value = App.today();
}
async function save() {
  const b = collect();
  if (!b) return;
  await App.post('/api/tool-inbound', b);
  App.toast('入库记录已保存，档案库存已累加', 'ok');
  resetForm(); load();
}

async function load() {
  const p = new URLSearchParams();
  if ($('#q_tool').value.trim()) p.set('tool', $('#q_tool').value.trim());
  if ($('#q_batch').value.trim()) p.set('batch_no', $('#q_batch').value.trim());
  if ($('#q_supplier').value.trim()) p.set('supplier', $('#q_supplier').value.trim());
  if ($('#q_from').value) p.set('from', $('#q_from').value);
  if ($('#q_to').value) p.set('to', $('#q_to').value);
  rows = await App.get('/api/tool-inbound?' + p);
  const e = App.escapeHtml;
  $('#tbody').innerHTML = rows.length ? rows.map((r, i) => `<tr>
    <td>${i + 1}</td>
    <td>${e(r.inbound_date)}</td>
    <td>${r.tool_code ? '<b>' + e(r.tool_code) + '</b>' : '-'}</td>
    <td>${e(r.tool_name) || '-'}</td>
    <td class="num">${r.qty}</td>
    <td>${e(r.supplier) || '-'}</td>
    <td>${e(r.batch_no) || '-'}</td>
    <td class="num">${(+r.price).toFixed(2)}</td>
    <td>${e(r.remark) || '-'}</td>
    <td>${e(r.created_by)}</td>
    <td class="actions-col need-write">
      <button class="btn sm ghost" onclick="openEdit(${r.id})">编辑</button>
      <button class="btn sm red" onclick="delRow(${r.id})">删除</button>
    </td>
  </tr>`).join('') : '<tr><td colspan="11" class="empty-tip">暂无入库记录</td></tr>';
}

function openEdit(id) {
  const r = rows.find(x => x.id === id);
  if (!r) return;
  $('#e_id').value = r.id;
  $('#e_date').value = r.inbound_date; $('#e_code').value = r.tool_code || '';
  $('#e_name').value = r.tool_name || ''; $('#e_supplier').value = r.supplier || '';
  $('#e_batch').value = r.batch_no || ''; $('#e_qty').value = r.qty;
  $('#e_price').value = r.price || ''; $('#e_remark').value = r.remark || '';
  $('#editMask').style.display = 'flex';
}
function closeEdit() { $('#editMask').style.display = 'none'; }
async function saveEdit() {
  const id = $('#e_id').value;
  const date = $('#e_date').value;
  const code = $('#e_code').value.trim();
  const name = $('#e_name').value.trim();
  if (!date) return App.toast('请填写入库日期', 'err');
  if (!code && !name) return App.toast('请填写工具编号或名称', 'err');
  await App.put('/api/tool-inbound/' + id, {
    inbound_date: date, tool_code: code, tool_name: name,
    supplier: $('#e_supplier').value.trim(),
    batch_no: $('#e_batch').value.trim(),
    qty: Math.max(1, parseInt($('#e_qty').value) || 1),
    price: parseFloat($('#e_price').value) || 0,
    remark: $('#e_remark').value.trim()
  });
  App.toast('已保存', 'ok');
  closeEdit(); load();
}
async function delRow(id) {
  if (!confirm('确定删除该入库记录？删除后对应工具的库存会回退该批次数量。')) return;
  await App.del('/api/tool-inbound/' + id);
  App.toast('已删除', 'ok'); load();
}

function doExport() {
  if (!rows.length) return App.toast('没有可导出的数据', 'err');
  const range = ($('#q_from').value || '') + ($('#q_from').value || $('#q_to').value ? ' 至 ' : '') + ($('#q_to').value || '');
  const e = App.escapeHtml;
  App.exportExcel('工具入库记录',
    ['序号', '入库日期', '工具编号', '工具名称', '入库数量', '供应商', '批次号', '单价(元/个)', '备注', '录入人'],
    rows.map((r, i) => [i + 1, r.inbound_date, r.tool_code, r.tool_name, +r.qty, r.supplier, r.batch_no, +r.price,
      r.remark, r.created_by]),
    '工具入库', {
      title: '工具入库记录',
      meta: (range ? '日期范围：' + range : ''),
      numCols: [4, 7],
      sign: ['仓库管理员：', '复核：', '主管：']
    });
}

load();
</script>
</body>
</html>
