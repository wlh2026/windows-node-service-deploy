<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 - 四福车间管理系统</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-box">
    <h1>🏭 四福车间管理系统</h1>
    <div class="sub">铜线出入库台账 · 小型工具管理台账</div>
    <input id="u" placeholder="用户名" autocomplete="username">
    <input id="p" type="password" placeholder="密码" autocomplete="current-password">
    <button class="btn" id="loginBtn">登 录</button>
    <p style="text-align:center;color:#9aa5b5;font-size:12px;margin-top:16px">
      初始账号：admin　初始密码：admin123<br>登录后请在「用户管理」中修改密码
    </p>
    <div style="text-align:center;color:#9aa5b5;font-size:11.5px;margin-top:18px;border-top:1px dashed #dde3ec;padding-top:10px">
      程序设计：<b style="color:#1e5eb8">吴灵华</b>　·　当前版本：<b id="loginVer" style="color:#1e5eb8">v…</b>
    </div>
  </div>
</div>
<script src="js/app.js"></script>
<script>
async function doLogin() {
  const username = $('#u').value.trim(), password = $('#p').value;
  if (!username || !password) return App.toast('请输入用户名和密码', 'err');
  try {
    const r = await fetch('/api/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const j = await r.json();
    if (!j.ok) return App.toast(j.msg, 'err');
    localStorage.setItem('wb_token', j.data.token);
    localStorage.setItem('wb_user', JSON.stringify(j.data));
    location.href = 'index.html';
  } catch (e) { App.toast('无法连接服务器', 'err'); }
}
$('#loginBtn').onclick = doLogin;
document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
fetch('/api/version').then(r=>r.json()).then(j=>{ if(j.ok){ $('#loginVer').textContent='v'+j.data.version; }}).catch(()=>{});
</script>
</body>
</html>
